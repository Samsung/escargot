name: ARM Development Benchmark
run-name: ARM benchmark ${{ inputs.fork_owner || github.actor }}/escargot @ ${{ inputs.branch }}

on:
  workflow_dispatch:
    inputs:
      fork_owner:
        description: 'Fork owner (blank uses your GitHub login; Samsung uses the upstream repository)'
        type: string
        default: ''
      branch:
        description: 'Branch to build in the selected escargot repository'
        type: string
        required: true
        default: 'perf-yarr-interpreter-fastpaths'
      benchmark_file:
        description: 'Optional shell script in the fork branch; blank uses tools/arm-benchmark-suites.sh from bench'
        type: string
        default: ''
      repetitions:
        description: 'Scored runs of each suite, on both ARM64 and ARM32'
        type: choice
        options: ['1', '3', '5']
        default: '3'

permissions: {}

jobs:
  authorize:
    if: >-
      github.repository == 'Samsung/escargot' &&
      github.event_name == 'workflow_dispatch' &&
      github.ref == 'refs/heads/bench' &&
      github.event.repository.fork == false
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      allowed: ${{ steps.permission.outputs.allowed }}
      repository: ${{ steps.permission.outputs.repository }}
      revision: ${{ steps.permission.outputs.revision }}
    steps:
      - name: Require maintain or admin permission and resolve the source revision
        id: permission
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8
        env:
          FORK_OWNER: ${{ inputs.fork_owner }}
          SOURCE_BRANCH: ${{ inputs.branch }}
        with:
          script: |
            const { owner, repo } = context.repo;
            const triggeringActor = process.env.GITHUB_TRIGGERING_ACTOR;
            if (!triggeringActor)
              throw new Error('Missing triggering actor');
            for (const username of new Set([context.actor, context.payload.sender.login, triggeringActor])) {
              const { data } = await github.rest.repos.getCollaboratorPermissionLevel({
                owner, repo, username
              });
              if (!['maintain', 'admin'].includes(data.role_name)
                  && data.user?.permissions?.maintain !== true
                  && data.user?.permissions?.admin !== true)
                throw new Error(`${username} needs maintain or admin permission`);
            }
            const sourceOwner = process.env.FORK_OWNER.trim() || triggeringActor;
            if (!/^[a-z\d](?:[a-z\d-]{0,37}[a-z\d])?$/i.test(sourceOwner))
              throw new Error('Invalid fork owner');
            const { data: source } = await github.rest.repos.get({ owner: sourceOwner, repo });
            if (source.private || (source.full_name !== `${owner}/${repo}`
                && (!source.fork || source.source?.full_name !== `${owner}/${repo}`)))
              throw new Error('Source must be the public upstream repository or one of its forks');
            const { data: branch } = await github.rest.repos.getBranch({
              owner: sourceOwner, repo, branch: process.env.SOURCE_BRANCH
            });
            if (!/^[a-f\d]{40}$/.test(branch.commit.sha))
              throw new Error('Invalid source revision');
            core.setOutput('repository', source.full_name);
            core.setOutput('revision', branch.commit.sha);
            core.setOutput('allowed', 'true');
            core.info(`Authorized ${triggeringActor}: ${source.full_name}@${branch.commit.sha}`);

  benchmark:
    needs: authorize
    if: needs.authorize.outputs.allowed == 'true'
    runs-on: [self-hosted, linux, arm64, test]
    timeout-minutes: 180
    permissions:
      contents: read
    concurrency:
      group: performance-benchmark-master
      cancel-in-progress: false
    steps:
      - name: Check out the upstream benchmark harness
        uses: actions/checkout@v5
        with:
          persist-credentials: false
      - name: Build and measure ARM64 and ARM32 sequentially
        shell: bash
        env:
          SOURCE_REPOSITORY: ${{ needs.authorize.outputs.repository }}
          SOURCE_REVISION: ${{ needs.authorize.outputs.revision }}
          REPETITIONS: ${{ inputs.repetitions }}
          BENCHMARK_FILE: ${{ inputs.benchmark_file }}
        run: bash tools/run-arm-development-benchmark.sh

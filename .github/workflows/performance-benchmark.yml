name: Performance Benchmark

# Only merged work reaches master; fork PRs never run on this self-hosted runner.
on:
  workflow_run:
    workflows: ["ES-Actions"]
    types: [completed]
    branches: [master]
  workflow_dispatch:

concurrency:
  group: performance-benchmark-master
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  benchmark-arm64:
    if: github.repository == 'Samsung/escargot' && (github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success')
    runs-on: [self-hosted, linux, arm64, test]
    timeout-minutes: 180
    env:
      TARGET_SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
    permissions:
      contents: write
      pages: write
      id-token: write
    steps:
    - uses: actions/checkout@v5
      with:
        ref: ${{ env.TARGET_SHA }}
        submodules: recursive

    - uses: actions/configure-pages@v5

    - name: Build and measure with exclusive host access
      shell: bash
      run: |
        set -euo pipefail
        lock_dir="$HOME/.cache/escargot-locks"
        install -d -m 700 "$lock_dir"
        # Never wait forever if a runner is lost while holding the lock.
        flock -x -w 3600 "$lock_dir/performance-host.lock" bash -euo pipefail -s <<'LOCKED'
          report="$GITHUB_WORKSPACE/performance-report"
          build="$GITHUB_WORKSPACE/out/performance-release"
          mkdir -p "$report/logs"
          icu_dir="/usr/icu78-64"
          if [ -d "$icu_dir" ]; then
            export LDFLAGS="-L$icu_dir/lib/ -Wl,-rpath=$icu_dir/lib/"
            export PKG_CONFIG_PATH="$icu_dir/lib/pkgconfig/"
            export LD_LIBRARY_PATH="$icu_dir/lib/"
          fi
          cmake -S "$GITHUB_WORKSPACE" -B "$build" -GNinja -DCMAKE_BUILD_TYPE=Release -DESCARGOT_DEPLOY=ON -DESCARGOT_THREADING=ON -DESCARGOT_TCO=ON -DENABLE_SHELL=ON
          ninja -C "$build"
          engine="$build/escargot"
          # Web Tooling Benchmark defaults to 20 samples per sub-benchmark.
          # Reduce it before npm ci so postinstall bundles the one-sample suite.
          sed -i 's/minSamples: 20/minSamples: 1/' "$GITHUB_WORKSPACE/test/web-tooling-benchmark/src/suite.js"
          (cd "$GITHUB_WORKSPACE/test/web-tooling-benchmark" && npm ci)
          # test/octane is a stock chromium/octane submodule checkout; overlay
          # the single-pass memory driver (tracked under tools/test/octane,
          # since the submodule only carries its own tracked content and
          # .gitmodules ignores untracked files here) that CodeLoad needs for
          # a speed-independent RSS metric.
          cp "$GITHUB_WORKSPACE/tools/test/octane/base_mem.js" "$GITHUB_WORKSPACE/tools/test/octane/run_mem_ci.js" "$GITHUB_WORKSPACE/test/octane/"
          measure() {
            name="$1"; dir="$2"; script="$3"
            rss_file="$report/$name.rss-kb"
            : > "$rss_file"
            # GNU time reports only a process's peak RSS. Sample VmRSS while
            # it runs so the dashboard can report both average and maximum.
            (cd "$dir" && exec env LD_LIBRARY_PATH="${LD_LIBRARY_PATH:-}" "$engine" "$script") >"$report/logs/$name.log" 2>&1 &
            pid="$!"
            while kill -0 "$pid" 2>/dev/null; do
              awk '/^VmRSS:/{print $2}' "/proc/$pid/status" 2>/dev/null >> "$rss_file" || true
              sleep 0.05
            done
            if ! wait "$pid"; then
              return 1
            fi
            if [ ! -s "$rss_file" ]; then
              echo "Could not collect RSS samples for $name" >&2
              return 1
            fi
          }
          # Warm-up is intentionally excluded from the reported measurements.
          measure octane-warmup "$GITHUB_WORKSPACE/test/octane" run.js
          measure web-tooling-warmup "$GITHUB_WORKSPACE/test/web-tooling-benchmark" dist/cli.js
          for n in 1; do
            measure "octane-$n" "$GITHUB_WORKSPACE/test/octane" run.js
            # Octane's own RSS during the timed run above scales with however
            # many iterations the engine's speed fit into the window, not
            # with actual retention - fatal for CodeLoad, which permanently
            # pins a compiled function tree per iteration (spec-required
            # non-configurable global property; see
            # escargot-codeload-retention-scales-with-speed). So Octane's
            # RSS is measured separately, from run_mem_ci.js's single fixed-
            # work pass over every suite. No warm-up run needed: this driver
            # never loops, so engine speed can't change how much work it does.
            measure "octane-mem-$n" "$GITHUB_WORKSPACE/test/octane" run_mem_ci.js
            measure "web-tooling-$n" "$GITHUB_WORKSPACE/test/web-tooling-benchmark" dist/cli.js
          done
          sed 's/^  //' <<'  PY' | python3 - "$report"
          import json, pathlib, re, statistics, sys
          report = pathlib.Path(sys.argv[1])
          def collect(prefix, pattern, rss_prefix=None):
              # rss_prefix lets score and RSS come from different runs: Octane's
              # own timed run ties iteration count (and thus CodeLoad's
              # permanently-retained memory) to engine speed, so its RSS is
              # sampled from a separate single fixed-work-pass run instead
              # (see run_mem_ci.js / escargot-codeload-retention-scales-with-speed).
              rss_prefix = rss_prefix or prefix
              score, rss, output = [], [], []
              for n in range(1, 2):
                  log = (report / "logs" / f"{prefix}-{n}.log").read_text(errors="replace")
                  match = re.search(pattern, log)
                  if not match: raise SystemExit(f"Could not parse {prefix} run {n}")
                  score.append(float(match.group(1)))
                  rss.extend(int(value) for value in (report / f"{rss_prefix}-{n}.rss-kb").read_text().split())
                  output.append(log)
                  if rss_prefix != prefix:
                      output.append((report / "logs" / f"{rss_prefix}-{n}.log").read_text(errors="replace"))
              if not rss: raise SystemExit(f"Could not collect RSS samples for {rss_prefix}")
              return {"score": round(statistics.mean(score), 2), "samples": score,
                "average_rss_kb": round(statistics.mean(rss)), "maximum_rss_kb": max(rss),
                "rss_samples_kb": rss, "output": output}
          data = {"octane": collect("octane", r"Score \(version [^)]+\):\s*([0-9.]+)", rss_prefix="octane-mem"),
            "web_tooling": collect("web-tooling", r"Geometric mean:\s*([0-9.]+)\s+runs/s")}
          (report / "measurements.json").write_text(json.dumps(data, indent=2) + "\n")
          rss = data["octane"]["rss_samples_kb"] + data["web_tooling"]["rss_samples_kb"]
          (report / "summary.txt").write_text(f"Octane score: {data['octane']['score']}\nWeb Tooling score: {data['web_tooling']['score']} runs/s\nAverage RSS: {round(statistics.mean(rss))} KB\nMaximum RSS: {max(rss)} KB\n")
          PY
        LOCKED

    - uses: actions/upload-artifact@v6
      with:
        name: performance-report-${{ env.TARGET_SHA }}
        path: performance-report/

    - name: Publish history and dashboard
      shell: bash
      env:
        REVISION: ${{ env.TARGET_SHA }}
        REVISION_URL: ${{ github.server_url }}/${{ github.repository }}/commit/${{ env.TARGET_SHA }}
      run: |
        set -euo pipefail
        site="$RUNNER_TEMP/escargot-performance-pages"
        if git ls-remote --exit-code --heads origin gh-pages >/dev/null; then
          git fetch origin gh-pages:gh-pages
          git worktree add --force "$site" gh-pages
        else
          git worktree add --orphan "$site" gh-pages
        fi
        mkdir -p "$site/performance/data" "$site/performance/raw"
        # This is a static dashboard. Do not let GitHub Pages process files
        # from any checked-out documentation tree with Jekyll.
        touch "$site/.nojekyll"
        cp performance-report/measurements.json "$site/performance/raw/$REVISION.json"
        python3 - "$site/performance/data/history.json" performance-report/measurements.json <<'PY'
        import datetime, json, os, pathlib, sys
        history_file, source_file = map(pathlib.Path, sys.argv[1:])
        history = json.loads(history_file.read_text()) if history_file.exists() else []
        item = json.loads(source_file.read_text())
        item.update({"sha": os.environ["REVISION"], "short_sha": os.environ["REVISION"][:7], "revision_url": os.environ["REVISION_URL"], "measured_at": datetime.datetime.now(datetime.timezone.utc).isoformat().replace("+00:00", "Z"),
          "octane_rss_method": "octane-mem-single-pass-v1"})
        # Earlier entries reported GNU time's peak RSS as both average and
        # maximum. Drop them; only sampled-RSS entries are comparable.
        # Octane's Avg/Max RSS also changed source: it used to come from
        # Octane's own timed run, whose iteration count (and so CodeLoad's
        # permanently-retained memory) tracks engine speed rather than actual
        # retention. It now comes from a single fixed-work pass instead (see
        # run_mem_ci.js). Entries predating that switch aren't comparable
        # either, so drop anything missing the current octane_rss_method tag.
        history = [x for x in history if x.get("measured_at") and x["sha"] != item["sha"]
                   and x.get("octane_rss_method") == item["octane_rss_method"]] + [item]
        history_file.write_text(json.dumps(history[-200:], indent=2) + "\n")
        PY
        python3 - "$site/index.html" README.md <<'PY'
        import sys, subprocess, pathlib, re, urllib.parse
        html_file, readme_file = map(pathlib.Path, sys.argv[1:3])
        # Keep the release and license badges on the Pages landing page, but
        # omit CI, Coverity, and Codecov status badges.
        hidden_badges = ("Actions Status", "Coverity Scan Build Status", "codecov")
        readme_markdown = "\n".join(
            line for line in readme_file.read_text().splitlines()
            if not any(badge in line for badge in hidden_badges)
        )
        readme_html = subprocess.check_output(["npx", "--yes", "marked"], input=readme_markdown.encode()).decode("utf-8")
        readme_html = re.sub(r'^\s*<h1>Escargot</h1>', '', readme_html, count=1)

        def rewrite_links(html):
            def replacer(match):
                attr = match.group(1)
                quote = match.group(2)
                url = match.group(3)
                parsed = urllib.parse.urlparse(url)
                if parsed.scheme or url.startswith('#'):
                    return f'{attr}={quote}{url}{quote}'
                clean_url = url.lstrip('./')
                return f'{attr}={quote}https://github.com/Samsung/escargot/blob/master/{clean_url}{quote}'
            pattern = r'(href|src)=(["\'])(.*?)\2'
            return re.sub(pattern, replacer, html)

        processed_html = rewrite_links(readme_html)

        template = f"""<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Escargot</title>
        <style>
          body{{margin:0;background:#0b1220;color:#e5edf8;font:16px/1.6 system-ui;line-height:1.6}}
          main{{max-width:900px;margin:8vh auto;padding:32px}}
          .mark{{color:#7dd3fc;font-weight:700;letter-spacing:.08em;text-transform:uppercase}}
          .hero{{margin-bottom:48px}}
          h1{{font-size:48px;margin:.15em 0}}
          .lead{{font-size:20px;line-height:1.6;color:#b9c7da}}
          .links{{display:flex;flex-wrap:wrap;gap:12px;margin-top:28px}}
          a{{color:#7dd3fc;text-decoration:none}}
          .links a{{background:#17243a;border:1px solid #304664;border-radius:10px;padding:12px 16px;color:#7dd3fc;text-decoration:none}}
          .links a:hover{{background:#213451}}
          .readme {{margin-top:64px;border-top:1px solid #304664;padding-top:48px}}
          .readme h1, .readme h2, .readme h3, .readme h4, .readme h5, .readme h6 {{color:#7dd3fc;margin-top:1.5em;margin-bottom:0.5em}}
          .readme h1 {{font-size:32px;border-bottom:1px solid #304664;padding-bottom:8px}}
          .readme h2 {{font-size:24px;border-bottom:1px solid #22344e;padding-bottom:6px}}
          .readme h3 {{font-size:20px}}
          .readme p {{margin:1em 0}}
          .readme a {{color:#38bdf8;text-decoration:underline}}
          .readme a:hover {{color:#7dd3fc}}
          .readme pre {{background:#17243a;border:1px solid #304664;border-radius:8px;padding:16px;overflow-x:auto;font-family:monospace}}
          .readme code {{font-family:monospace;background:#17243a;padding:2px 6px;border-radius:4px;font-size:0.9em}}
          .readme pre code {{background:none;padding:0;border-radius:0;font-size:1em}}
          .readme table {{width:100%;border-collapse:collapse;margin:24px 0}}
          .readme th, .readme td {{border:1px solid #304664;padding:10px;text-align:left}}
          .readme th {{background:#17243a;color:#7dd3fc}}
          .readme blockquote {{border-left:4px solid #7dd3fc;margin:0;padding-left:16px;color:#b9c7da}}
          .readme ul, .readme ol {{padding-left:24px}}
          .readme li {{margin-bottom:8px}}
          .readme img {{max-width:100%;height:auto}}
        </style>
        <main>
          <div class="hero">
            <div class="mark">Samsung Open Source</div>
            <h1>Escargot</h1>
            <p class="lead">A lightweight JavaScript engine written in C++.</p>
            <div class="links">
              <a href="https://github.com/Samsung/escargot">GitHub repository</a>
              <a href="performance/">Performance dashboard</a>
            </div>
          </div>
          <div class="readme">
            {processed_html}
          </div>
        </main>
        </html>
        """
        html_file.write_text(template, encoding="utf-8")
        PY
        cat > "$site/performance/index.html" <<'HTML'
        <!doctype html><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Escargot performance</title>
        <style>body{margin:0;background:#0b1220;color:#e5edf8;font:15px system-ui}main{max-width:1100px;margin:auto;padding:32px}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:16px}.card{background:#17243a;border:1px solid #304664;border-radius:14px;padding:16px}canvas{width:100%;height:220px}table{width:100%;border-collapse:collapse;margin-top:28px}td,th{padding:9px;border-bottom:1px solid #304664;text-align:right}td:first-child,th:first-child{text-align:left}a{color:#7dd3fc}details{text-align:left;white-space:pre-wrap}code{font-size:11px}</style>
        <main>
          <h1>Escargot performance</h1>
          <p>master only. One measured run per benchmark; warm-up is excluded. RSS is sampled every 50 ms while the benchmark runs.</p>
          <p><strong>Octane Avg/Max RSS methodology:</strong> measured from a separate single fixed-work pass over every Octane suite (<code>test/octane/run_mem_ci.js</code>), not from Octane's normal timed run. Octane's own loop ties each suite's iteration count to engine speed, and CodeLoad's <code>cacheBust()</code> makes every eval permanently retain its compiled function tree (a spec-required non-configurable global property, not a leak) - so a faster/slower engine alone used to shift these RSS numbers with no real behavior change. Octane Score is unaffected and still comes from the normal timed run. History predating this change used the old speed-dependent method and was dropped as not comparable.</p>
          <div class="grid">
            <section class="card"><h2>Octane Score</h2><canvas id="octane_score"></canvas></section>
            <section class="card"><h2>Web Tooling Score</h2><canvas id="web_score"></canvas></section>
            <section class="card"><h2>Octane Avg RSS (MiB)</h2><canvas id="octane_avg"></canvas></section>
            <section class="card"><h2>Octane Max RSS (MiB)</h2><canvas id="octane_max"></canvas></section>
            <section class="card"><h2>Web Tooling Avg RSS (MiB)</h2><canvas id="web_avg"></canvas></section>
            <section class="card"><h2>Web Tooling Max RSS (MiB)</h2><canvas id="web_max"></canvas></section>
          </div>
          <div style="overflow-x:auto">
            <table>
              <thead>
                <tr>
                  <th>Commit</th>
                  <th>Measured (UTC)</th>
                  <th>Octane Score</th>
                  <th>Web Tooling Score</th>
                  <th>Octane Avg RSS</th>
                  <th>Octane Max RSS</th>
                  <th>Web Tooling Avg RSS</th>
                  <th>Web Tooling Max RSS</th>
                  <th>Printed output</th>
                </tr>
              </thead>
              <tbody id="rows"></tbody>
            </table>
          </div>
        </main>
        <script>
        fetch("data/history.json").then(r=>r.json()).then(d=>{
          let m=x=>x/1024,
          v={
            octane_score:x=>x.octane.score,
            web_score:x=>x.web_tooling.score,
            octane_avg:x=>m(x.octane.average_rss_kb),
            octane_max:x=>m(x.octane.maximum_rss_kb),
            web_avg:x=>m(x.web_tooling.average_rss_kb),
            web_max:x=>m(x.web_tooling.maximum_rss_kb)
          },
          colors={
            octane_score:"#38bdf8",
            web_score:"#38bdf8",
            octane_avg:"#4ade80",
            octane_max:"#22c55e",
            web_avg:"#fbbf24",
            web_max:"#f59e0b"
          };
          Object.entries(v).forEach(([id,f])=>{
            let a=d.map(f),c=document.querySelector("#"+id),x=c.getContext("2d"),
            w=c.width=c.clientWidth*devicePixelRatio,h=c.height=c.clientHeight*devicePixelRatio,p=30,
            lo=Math.min(...a),hi=Math.max(...a),r=hi-lo||1;
            x.strokeStyle=colors[id]||"#38bdf8";
            x.lineWidth=2;
            x.beginPath();
            a.forEach((n,i)=>{
              let X=p+i*(w-2*p)/Math.max(1,a.length-1),Y=h-p-(n-lo)*(h-2*p)/r;
              i?x.lineTo(X,Y):x.moveTo(X,Y)
            });
            x.stroke();
            x.fillStyle="#e5edf8";
            x.fillText(hi.toFixed(2),p,16);
            x.fillText(lo.toFixed(2),p,h-10)
          });
          rows.innerHTML=d.slice().reverse().map(x=>"<tr><td><a href='"+x.revision_url+"'>"+x.short_sha+"</a></td><td>"+(x.measured_at ? new Date(x.measured_at).toISOString().replace("T"," ").replace(".000Z","Z") : "—")+"</td><td>"+x.octane.score+"</td><td>"+x.web_tooling.score+"</td><td>"+v.octane_avg(x).toFixed(1)+" MiB</td><td>"+v.octane_max(x).toFixed(1)+" MiB</td><td>"+v.web_avg(x).toFixed(1)+" MiB</td><td>"+v.web_max(x).toFixed(1)+" MiB</td><td><details><summary>logs</summary><code>"+[...x.octane.output,...x.web_tooling.output].join("\n\n")+"</code></details></td></tr>").join("")
        })
        </script>
        HTML
        cd "$site"
        git config user.name "github-actions[bot]"
        git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
        git add .nojekyll index.html performance/index.html performance/data/history.json "performance/raw/$REVISION.json"
        git diff --cached --quiet || git commit -m "performance: $REVISION"
        git push origin gh-pages

        # Deploy the generated static branch contents, without the worktree's
        # .git directory, through the GitHub Pages artifact flow.
        mkdir -p "$GITHUB_WORKSPACE/performance-pages"
        git archive --format=tar gh-pages | tar -xf - -C "$GITHUB_WORKSPACE/performance-pages"

    - name: Upload GitHub Pages artifact
      uses: actions/upload-pages-artifact@v3
      with:
        path: performance-pages

  deploy-pages:
    needs: benchmark-arm64
    if: github.repository == 'Samsung/escargot'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
    - name: Deploy GitHub Pages
      id: deployment
      uses: actions/deploy-pages@v4

name: ARM Development Benchmark
run-name: ARM benchmark ${{ inputs.repository || github.actor }} @ ${{ inputs.branch }}

on:
  workflow_dispatch:
    inputs:
      repository:
        description: 'Source owner/repo (blank uses your GitHub login/escargot)'
        type: string
        default: ''
      branch:
        description: 'Branch, tag or commit to measure'
        type: string
        required: true
        default: 'master'
      benchmark_file:
        description: 'Optional Python file (source path or bench:path); blank runs WTB'
        type: string
        default: ''
      repetitions:
        description: 'Scored runs of each suite, on both ARM64 and ARM32'
        type: choice
        options: ['1', '3', '5']
        default: '1'
      upload_artifact:
        description: 'Upload measurement logs, metadata and experiment output'
        type: boolean
        default: true
      profile:
        description: 'Collect perf counters and samples for fixed-work WTB'
        type: boolean
        default: false

permissions: {}

jobs:
  authorize:
    if: >-
      github.repository == 'Samsung/escargot' &&
      github.event_name == 'workflow_dispatch' &&
      github.ref == 'refs/heads/bench' &&
      github.event.repository.fork == false
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      allowed: ${{ steps.permission.outputs.allowed }}
      repository: ${{ steps.permission.outputs.repository }}
      revision: ${{ steps.permission.outputs.revision }}
    steps:
      - name: Require maintain or admin permission and resolve the source revision
        id: permission
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8
        env:
          INPUT_REPOSITORY: ${{ inputs.repository }}
          SOURCE_BRANCH: ${{ inputs.branch }}
        with:
          script: |
            const { owner, repo } = context.repo;
            const triggeringActor = process.env.GITHUB_TRIGGERING_ACTOR;
            if (!triggeringActor)
              throw new Error('Missing triggering actor');
            for (const username of new Set([context.actor, context.payload.sender.login, triggeringActor])) {
              const { data } = await github.rest.repos.getCollaboratorPermissionLevel({
                owner, repo, username
              });
              if (!['maintain', 'admin'].includes(data.role_name)
                  && data.user?.permissions?.maintain !== true
                  && data.user?.permissions?.admin !== true)
                throw new Error(`${username} needs maintain or admin permission`);
            }
            const repository = process.env.INPUT_REPOSITORY.trim() || `${triggeringActor}/${repo}`;
            if (!/^[a-z\d](?:[a-z\d-]{0,37}[a-z\d])?\/[a-z\d_.-]+$/i.test(repository))
              throw new Error('Invalid source owner/repo');
            const [sourceOwner, sourceRepo] = repository.split('/');
            const { data: source } = await github.rest.repos.get({ owner: sourceOwner, repo: sourceRepo });
            if (source.private || (source.full_name !== `${owner}/${repo}`
                && (!source.fork || source.source?.full_name !== `${owner}/${repo}`)))
              throw new Error('Source must be the public upstream repository or one of its forks');
            const { data: commit } = await github.rest.repos.getCommit({
              owner: sourceOwner, repo: sourceRepo, ref: process.env.SOURCE_BRANCH
            });
            if (!/^[a-f\d]{40}$/.test(commit.sha))
              throw new Error('Invalid source revision');
            core.setOutput('repository', source.full_name);
            core.setOutput('revision', commit.sha);
            core.setOutput('allowed', 'true');
            core.info(`Authorized ${triggeringActor}: ${source.full_name}@${commit.sha}`);

  benchmark:
    needs: authorize
    if: needs.authorize.outputs.allowed == 'true'
    runs-on: [self-hosted, linux, arm64, test]
    timeout-minutes: 180
    permissions:
      contents: read
    steps:
      - name: Check out the upstream benchmark harness
        uses: actions/checkout@v5
        with:
          persist-credentials: false
      - name: Build and measure ARM32 then ARM64
        id: measure
        shell: bash
        env:
          SOURCE_REPOSITORY: ${{ needs.authorize.outputs.repository }}
          SOURCE_REVISION: ${{ needs.authorize.outputs.revision }}
          REPETITIONS: ${{ inputs.repetitions }}
          BENCHMARK_FILE: ${{ inputs.benchmark_file }}
          BENCHMARK_PROFILE: ${{ inputs.profile }}
        run: python3 -u tools/run-arm-development-benchmark.py
      - name: Upload measurement data
        if: always() && inputs.upload_artifact && steps.measure.outputs.report_directory != ''
        uses: actions/upload-artifact@v6
        with:
          name: arm-benchmark-${{ needs.authorize.outputs.revision }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ steps.measure.outputs.report_directory }}/
          if-no-files-found: error
          retention-days: 14

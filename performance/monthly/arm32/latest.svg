<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="600" viewBox="0 0 1080 600" role="img" aria-labelledby="title desc">
<title id="title">ARM32 JavaScript engine performance and fixed-work memory</title>
<desc id="desc">Median of three memory runs. Memory uses RSS from fixed work; execution scores are measured separately.</desc>

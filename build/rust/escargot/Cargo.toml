[package]
name = "escargot"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "Thread-confined, rooted Rust bindings for Escargot"
publish = false

[features]
default = ["icu", "temporal"]
icu = ["escargot-sys/icu"]
temporal = ["icu", "escargot-sys/temporal"]
icu-bundled = ["icu", "escargot-sys/icu-bundled"]

[dependencies]
escargot-sys = { path = "../escargot-sys", default-features = false }

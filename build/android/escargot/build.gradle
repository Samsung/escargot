plugins {
    id 'com.android.library'
    id 'jacoco'
    id 'maven-publish'
}

ext {
    force64Option = System.getProperty("ESCARGOT_BUILD_64BIT_FORCE_LARGE", "ON")
    // CI's build-test-on-android job pairs each matrix leg's tested emulator
    // ABI with its corresponding real-device ABI (x86+armeabi-v7a,
    // x86_64+arm64-v8a) instead of this library's native build
    // unconditionally compiling all four abiFilters below on every
    // ./gradlew invocation -- each matrix leg was rebuilding all four ABIs
    // and only ever exercising its own, with armeabi-v7a/arm64-v8a's compile
    // going completely unverified as a signal of their own (see
    // .github/workflows/es-actions.yml, which passes comma-separated
    // -DESCARGOT_TEST_ABI=<cpu-abi>,<device-abi>). Real release/AAR builds
    // (see release.yml) never set this, so they still get the full
    // multi-ABI native build unchanged.
    testAbiOption = System.getProperty("ESCARGOT_TEST_ABI", "")
    escargotTestOption = System.getProperty("ESCARGOT_TEST", "OFF")
}

android {
    namespace 'com.samsung.lwe.escargot'
    compileSdk 36
    ndkVersion '28.1.13356709'

    defaultConfig {
        minSdk 28
        targetSdk 36

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        consumerProguardFiles "consumer-rules.pro"
        externalNativeBuild {
            cmake {
                // Deliberately NOT passing -DESCARGOT_TLS_ACCESS_BY_PTHREAD_KEY here:
                // leaving it unset lets CMakeLists.txt's own platform default
                // (ON for android, since ESCARGOT_THREADING defaults ON too)
                // apply, so this AAR build actually exercises that default
                // instead of just re-stating it from a second source of truth.
                arguments "-DANDROID_SUPPORT_FLEXIBLE_PAGE_SIZES=ON", "-DCMAKE_VERBOSE_MAKEFILE=ON", "-DCMAKE_SYSTEM_NAME=Android", "-DESCARGOT_BUILD_SHARED_LIBS=OFF", "-DENABLE_SHELL=OFF",
                        // Every other platform's CI leg already builds with this ON by
                        // default (see .github/workflows/es-actions.yml); Android was
                        // the one place still defaulting to CMakeLists.txt's opt-in
                        // OFF, so ShadowRealm silently went untested/unshipped here.
                        "-DESCARGOT_SHADOWREALM=ON",
                        "-DESCARGOT_BUILD_64BIT_FORCE_LARGE="+project.ext.force64Option,
                        "-DESCARGOT_TEST="+project.ext.escargotTestOption
            }
        }

        ndk {
            if (testAbiOption) {
                abiFilters.addAll(testAbiOption.split(","))
            } else {
                abiFilters.addAll("armeabi-v7a", "arm64-v8a", "x86", "x86_64")
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }

        debug {
            testCoverageEnabled true
            jniDebuggable = true
            ndk {
                debuggable = true
            }
        }

        debugShell {
            initWith(buildTypes.debug)
            externalNativeBuild {
                cmake {
                    arguments "-DCMAKE_VERBOSE_MAKEFILE=ON", "-DCMAKE_SYSTEM_NAME=Android", "-DESCARGOT_BUILD_SHARED_LIBS=OFF", "-DENABLE_SHELL=ON"
                }
            }
        }

        releaseShell {
            initWith(buildTypes.release)
            jniDebuggable = true
            ndk {
                debuggable = true
            }
            externalNativeBuild {
                cmake {
                    arguments "-DCMAKE_VERBOSE_MAKEFILE=ON", "-DCMAKE_SYSTEM_NAME=Android", "-DESCARGOT_BUILD_SHARED_LIBS=OFF", "-DENABLE_SHELL=ON"
                }
            }
        }
    }

    sourceSets {
        main.java.srcDirs('src/main/java')
        test {
            java.srcDir('src/androidTest/java')
        }
    }

    externalNativeBuild {
        cmake {
            path "src/main/cpp/CMakeLists.txt"
        }
    }

    ndkVersion '27.0.12077973'

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    publishing {
        singleVariant("release") {
            // if you don't want sources/javadoc, remove these lines
            withSourcesJar()
            withJavadocJar()
        }
    }
}

publishing {
    publications {
        release(MavenPublication) {
            afterEvaluate {
                from components.findByName('release')
            }
            artifactId "escargot-android"
            groupId "com.samsung.lwe.escargot"
            version "X.X.X.20XXXXXX.X.XXXXXXXX"
        }
    }

    repositories {
        maven {
            url "/XXXXXX/android/releases/"
        }
    }
}

def dirForNativeNoNDK = project.layout.buildDirectory.get().dir("native_nondk")
def srcForNativeNoNDK = project.layout.projectDirectory.dir("src/main/cpp").asFile

task createNativeNoNDK() {
    def dstdir = dirForNativeNoNDK.asFile
    if (!dstdir.exists()) dstdir.mkdirs()
}
task buildCMakeNativeNoNDK(type: Exec) {
    dependsOn createNativeNoNDK
    workingDir dirForNativeNoNDK
    if (org.gradle.internal.os.OperatingSystem.current().isLinux()) {
        commandLine "/usr/bin/env", "cmake", "-DCMAKE_SYSTEM_NAME=Linux", "-DESCARGOT_BUILD_SHARED_LIBS=OFF",
                "-DESCARGOT_BUILD_64BIT_FORCE_LARGE="+project.ext.force64Option,
                "-DUNDER_NDK=OFF", srcForNativeNoNDK.absolutePath
    } else if (org.gradle.internal.os.OperatingSystem.current().isMacOsX()) {
        var javaHome = new ByteArrayOutputStream().withStream { os ->
            exec {
                executable "/usr/libexec/java_home"
                args "-v", "1.8"
                standardOutput = os
            }
            os.toString().trim()
        }
        var icu4cPath = new ByteArrayOutputStream().withStream { os ->
            exec {
                commandLine "sh", "-c", "brew --prefix icu4c"
                standardOutput = os
            }
            os.toString().trim()
        }
        var pkgConfigPath = icu4cPath + "/lib/pkgconfig"
        environment("PKG_CONFIG_PATH", pkgConfigPath)
        commandLine "/usr/bin/env", "cmake", "-DCMAKE_SYSTEM_NAME=Darwin", "-DESCARGOT_BUILD_SHARED_LIBS=OFF", "-DUNDER_NDK=OFF",
                "-DESCARGOT_BUILD_64BIT_FORCE_LARGE="+project.ext.force64Option,
                "-DESCARGOT_LIBICU_SUPPORT_WITH_DLOPEN=OFF",
                "-DJAVA_HOME=" + javaHome, "-DJAVA_INCLUDE_PATH=" + javaHome + "/include",
                "-DJAVA_INCLUDE_PATH2=" + javaHome + "/include/darwin", "-DJAVA_AWT_INCLUDE_PATH=" + javaHome + "/include",
                srcForNativeNoNDK.absolutePath
    } else {
        // TODO
    }
}

task buildGMakeNativeNoNDK(type: Exec) {
    dependsOn buildCMakeNativeNoNDK
    workingDir dirForNativeNoNDK
    commandLine "/usr/bin/env", "make", "-j" + Runtime.getRuntime().availableProcessors().toString();
}

task jacocoTestReport(type: JacocoReport, dependsOn: ['testDebugUnitTest', 'createDebugCoverageReport']) {
    reports {
        xml.required = true
        html.required = true
    }
    def mainSrc = "${project.projectDir}/src/main/java"
    sourceDirectories.setFrom(files([mainSrc]))

    def fileFilter = ['**/R.class', '**/R$*.class', '**/BuildConfig.*', '**/Manifest*.*', '**/*Test*.*',
                      'android/**/*.*', '**/*Activity*.*']
    def debugTree = fileTree(dir: "${buildDir}/intermediates/classes/debug", excludes: fileFilter)
    classDirectories.setFrom(files([debugTree]))

    executionData.setFrom(fileTree(dir: "${buildDir}/jacoco/testDebugUnitTest.exec"))
}

project.afterEvaluate {
    if (org.gradle.internal.os.OperatingSystem.current().isLinux() || org.gradle.internal.os.OperatingSystem.current().isMacOsX()) {
        tasks.matching { it.name == 'testDebugUnitTest' }.all {
            dependsOn buildGMakeNativeNoNDK
            systemProperty "java.library.path", dirForNativeNoNDK.asFile.absolutePath + ":" + System.getProperty("java.library.path")
        }
        tasks.matching { it.name == 'testReleaseUnitTest' }.all {
            dependsOn buildGMakeNativeNoNDK
            systemProperty "java.library.path", dirForNativeNoNDK.asFile.absolutePath + ":" + System.getProperty("java.library.path")
        }
    }
}

task clearHostJar(type: Delete) {
    delete 'build/libs/escargot.jar'
}

task bundleHostJar(type: Jar) {
    dependsOn buildGMakeNativeNoNDK
    dependsOn assemble
    from(zipTree('build/intermediates/aar_main_jar/release/syncReleaseLibJars/classes.jar'))
    from(dirForNativeNoNDK.asFile.toString() + "/libescargot-jni.so")
    from(dirForNativeNoNDK.asFile.toString() + "/libescargot-jni.dylib")
    rename("libescargot-jni.dylib", "libescargot-jni.so")
}

task sourcesJar(type: Jar) {
    from android.sourceSets.main.java.srcDirs
    archiveClassifier.set('sources')
    archiveBaseName.set("escargot")
}

task javadoc(type: Javadoc) {
    source = android.sourceSets.main.java.sourceFiles
    options.memberLevel = JavadocMemberLevel.PRIVATE
}

project.afterEvaluate {
    def compileTask = tasks.findByName('compileReleaseJavaWithJavac') ?: tasks.findByName('compileDebugJavaWithJavac')
    if (compileTask != null) {
        javadoc.classpath += compileTask.classpath
    }
}

task javadocJar(type: Jar, dependsOn: javadoc) {
    archiveClassifier.set('javadoc')
    archiveBaseName.set("escargot")
}

dependencies {
    testImplementation 'junit:junit:4.13.2'
    androidTestImplementation 'androidx.test.ext:junit:1.1.5'
    androidTestImplementation 'androidx.test.espresso:espresso-core:3.5.1'
}
